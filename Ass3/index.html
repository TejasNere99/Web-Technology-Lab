<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Joke Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#121212;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

}

.container{

    width:500px;
    max-width:90%;

    background:#1f1f1f;

    padding:30px;

    border-radius:12px;

    text-align:center;

    box-shadow:0 0 15px rgba(0,0,0,.4);

}

h1{

    margin-bottom:20px;

}

#joke{

    margin:30px 0;

    line-height:1.8;

    min-height:100px;

    font-size:18px;

}

button{

    padding:12px 25px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    background:#0d6efd;

    color:white;

    font-size:17px;

}

button:hover{

    background:#0b5ed7;

}

</style>

</head>

<body>

<div class="container">

<h1>Programming Joke Generator</h1>

<div id="joke">
Click the button to load a joke...
</div>

<button onclick="getJoke()">
Next Joke
</button>

</div>

<script>

async function getJoke(){

    const joke=document.getElementById("joke");

    joke.innerHTML="Loading...";

    try{

        const response=await fetch(
        "https://v2.jokeapi.dev/joke/Programming?safe-mode"
        );

        const data=await response.json();

        if(data.type==="single"){

            joke.innerHTML=data.joke;

        }
        else{

            joke.innerHTML=
            "<b>"+data.setup+"</b><br><br>"+data.delivery;

        }

    }

    catch(error){

        joke.innerHTML="Failed to load joke.";

    }

}

getJoke();

</script>

</body>
</html>
